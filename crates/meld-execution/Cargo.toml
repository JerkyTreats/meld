[package]
name = "meld-execution"
version = "2.7.0"
edition = "2021"
authors = ["Meld Contributors"]
description = "Execution authority contracts and runtime ports for Meld"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerkytreats/meld"

[dependencies]
async-trait = "0.1"
blake3 = "1.5"
futures = "0.3"
hex = "0.4"
meld-events = { path = "../meld-events", version = "2.7.0" }
meld-lang = { path = "../meld-lang", version = "2.7.0" }
petgraph = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sled = "0.34"
thiserror = "1.0"
tracing = "0.1"
walkdir = "2.4"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.27.0"
