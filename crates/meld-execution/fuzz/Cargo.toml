[package]
name = "meld-execution-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.meld-execution]
path = ".."

[dependencies.meld-lang]
path = "../../meld-lang"

[[bin]]
name = "fuzz_composition"
path = "fuzz_targets/fuzz_composition.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_task_network_contracts"
path = "fuzz_targets/fuzz_task_network_contracts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_task_network_command"
path = "fuzz_targets/fuzz_task_network_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_task_network_store_replay"
path = "fuzz_targets/fuzz_task_network_store_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_task_network_readiness"
path = "fuzz_targets/fuzz_task_network_readiness.rs"
test = false
doc = false
bench = false
