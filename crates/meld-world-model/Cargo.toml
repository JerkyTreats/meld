[package]
name = "meld-world-model"
version = "2.7.0"
edition = "2021"
authors = ["Meld Contributors"]
description = "World model materialization and query contracts for Meld"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerkytreats/meld"

[features]
default = []
test-support = ["meld-events/test-support"]

[dependencies]
meld-events = { path = "../meld-events", version = "2.7.0" }
meld-lang = { path = "../meld-lang", version = "2.7.0" }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
sled = "0.34"

[dev-dependencies]
meld-events = { path = "../meld-events", version = "2.7.0", features = ["test-support"] }
proptest = "1.4"
tempfile = "3.8"
