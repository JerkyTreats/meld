[package]
name = "meld-events"
version = "2.7.0"
edition = "2021"
authors = ["Meld Contributors"]
description = "Canonical event ledger contracts and runtime for Meld"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerkytreats/meld"

[dependencies]
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sled = "0.34"
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[[bench]]
name = "events"
harness = false

[[bench]]
name = "event_flywheel"
harness = false
